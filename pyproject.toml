[project]
name = "claude-agent-demo"
version = "0.1.0"
description = "Barebones Claude agent example"
authors = [{name = "OpenAI Codex Trial"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
